services:
  postgres:
    image: postgres:17
    container_name: paralives-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Paralives
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - paralives_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paralives_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paralives_pgdata:

